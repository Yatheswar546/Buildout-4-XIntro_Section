
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap - Make Remote Work</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="overlay" aria-hidden="true"></div>

    <header class="header">
        <a href="#" class="logo" aria-label="Snap home">
            <img src="./assets/images/logo.svg" alt="snap's logo">
        </a>

        <button class="open-menu" type="button" aria-label="Open navigation" aria-expanded="false">
            <img src="./assets/images/icon-menu.svg" alt="">
        </button>

        <nav class="nav" aria-label="Main navigation">
            <button class="close-menu" type="button" aria-label="Close navigation">
                <img src="./assets/images/icon-close-menu.svg" alt="">
            </button>

            <ul class="nav-list">
                <li class="nav-item">
                    <button class="nav-link dropdown-toggle" type="button" aria-expanded="false">
                        Features
                        <img class="arrow-icon" src="./assets/images/icon-arrow-down.svg" alt="">
                    </button>

                    <ul class="dropdown-list">
                        <li class="dropdown-link">
                            <a href="#" aria-label="todo-list">
                                <img src="./assets/images/icon-todo.svg" alt="">
                                Todo List
                            </a>
                        </li>
                        <li class="dropdown-link">
                            <a href="#">
                                <img src="./assets/images/icon-calendar.svg" alt="">
                                Calender
                            </a>
                        </li>
                        <li class="dropdown-link">
                            <a href="#">
                                <img src="./assets/images/icon-reminders.svg" alt="">
                                Reminders
                            </a>
                        </li>
                        <li class="dropdown-link">
                            <a href="#">
                                <img src="./assets/images/icon-planning.svg" alt="">
                                Planning
                            </a>
                        </li>
                    </ul>
                </li>

                <li class="nav-item">
                    <button class="nav-link dropdown-toggle" type="button" aria-expanded="false">
                        Company
                        <img class="arrow-icon" src="./assets/images/icon-arrow-down.svg" alt="">
                    </button>

                    <ul class="dropdown-list">
                        <li class="dropdown-link"><a href="#">History</a></li>
                        <li class="dropdown-link"><a href="#">Our Team</a></li>
                        <li class="dropdown-link"><a href="#">Blog</a></li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Careers</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>
            </ul>

            <div class="registration">
                <button type="button" class="login-button">Login</button>
                <button type="button" class="register-button">Register</button>
            </div>
        </nav>
    </header>

    <main class="hero">
        <picture class="hero-image">
            <source
                media="(min-width: 768px)"
                srcset="./assets/images/image-hero-desktop.png">
            <img
                src="./assets/images/image-hero-mobile.png"
                alt="A person using a laptop surrounded by colorful geometric shapes">
        </picture>

        <section class="text-content">
            <h1>Make remote work</h1>
            <p>
                Get your team in sync, no matter your location. Streamline
                processes, create team rituals, and watch productivity soar.
            </p>
            <button type="button" class="learn-more">Learn More</button>

            <div class="clients" aria-label="Our clients">
                <img src="./assets/images/client-databiz.svg" alt="Databiz">
                <img src="./assets/images/client-audiophile.svg" alt="Audiophile">
                <img src="./assets/images/client-meet.svg" alt="Meet">
                <img src="./assets/images/client-maker.svg" alt="Maker">
            </div>
        </section>
    </main>

    <footer class="attribution">
        Challenge by
        <a href="https://crio.do" target="_blank" rel="noopener noreferrer">Crio.do</a>.
        Coded by <a href="#" target="_blank" rel="noopener noreferrer">You</a>.
    </footer>

    <script src="./script.js"></script>
</body>
</html>
